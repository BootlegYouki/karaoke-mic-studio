[package]
name = "karaoke-mic-studio"
version = "1.0.0"
description = "Native Ultra-Low Latency Karaoke Microphone Studio"
authors = ["BootlegYouki"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
cpal = "0.15"
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
